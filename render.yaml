services:
  - type: web
    name: spendwise-tracker
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@expense.com
      - key: ADMIN_PASSWORD
        value: Admin@123
