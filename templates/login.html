<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - SpendWise Smart Expense Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-brand">
        <div class="logo-icon">
          <i class="fa-solid fa-wallet"></i>
        </div>
        <h1>Welcome Back</h1>
        <p>Sign in to your SpendWise dashboard</p>
      </div>

      <!-- Server error banner -->
      <div id="authAlert" class="form-error visible" style="display: none; margin-bottom: 1.2rem; padding: 0.75rem; background: var(--red-50); border: 1px solid var(--red-100); border-radius: var(--radius-md);">
        <i class="fa-solid fa-circle-exclamation"></i>
        <span id="authAlertText">Invalid credentials</span>
      </div>

      <form id="loginForm" method="POST" action="/login" novalidate>
        <div class="form-group">
          <label class="form-label" for="loginEmail">Email Address</label>
          <div class="search-input-box" style="min-width: 100%;">
            <i class="fa-regular fa-envelope"></i>
            <input type="email" id="loginEmail" name="email" class="form-control" placeholder="name@example.com" required autocomplete="email">
          </div>
          <div class="form-error" id="emailError"><i class="fa-solid fa-circle-exclamation"></i> Please enter a valid email address</div>
        </div>

        <div class="form-group">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.45rem;">
            <label class="form-label" for="loginPassword" style="margin-bottom: 0;">Password</label>
          </div>
          <div class="password-input-group">
            <input type="password" id="loginPassword" name="password" class="form-control" placeholder="Enter your password" required autocomplete="current-password">
            <button type="button" class="password-toggle-btn" id="togglePasswordBtn" title="Toggle password visibility" aria-label="Toggle password visibility">
              <i class="fa-regular fa-eye"></i>
            </button>
          </div>
          <div class="form-error" id="passwordError"><i class="fa-solid fa-circle-exclamation"></i> Password is required</div>
        </div>

        <button type="submit" class="btn btn-primary" id="loginSubmitBtn" style="width: 100%; margin-top: 0.5rem; padding: 0.8rem;">
          <span>Sign In</span>
          <i class="fa-solid fa-arrow-right"></i>
        </button>
      </form>

      <!-- Quick Demo Account Autofill Helper -->
      <div class="quick-fill-box" style="margin-top: 1.25rem;">
        <div>
          <strong>Demo User:</strong> demo@spendwise.com
        </div>
        <button type="button" class="btn btn-sm btn-outline" id="autoFillDemoBtn" style="font-size: 0.75rem; padding: 0.3rem 0.6rem;">
          Autofill
        </button>
      </div>

      <div class="auth-footer">
        <p>Don't have an account? <a href="/register" style="font-weight: 700;">Create Account</a></p>
        <p style="margin-top: 0.85rem; font-size: 0.82rem;">
          <a href="/admin/login" style="color: var(--gray-500);"><i class="fa-solid fa-shield-halved"></i> Admin Portal</a>
        </p>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script>
    // Autofill demo helper for tester convenience
    const autoFillBtn = document.getElementById('autoFillDemoBtn');
    if (autoFillBtn) {
      autoFillBtn.addEventListener('click', () => {
        document.getElementById('loginEmail').value = 'demo@spendwise.com';
        document.getElementById('loginPassword').value = 'Password@123';
      });
    }

    // Toggle password visibility
    const toggleBtn = document.getElementById('togglePasswordBtn');
    const pwdInput = document.getElementById('loginPassword');
    toggleBtn.addEventListener('click', () => {
      const type = pwdInput.getAttribute('type') === 'password' ? 'text' : 'password';
      pwdInput.setAttribute('type', type);
      toggleBtn.innerHTML = type === 'password' ? '<i class="fa-regular fa-eye"></i>' : '<i class="fa-regular fa-eye-slash"></i>';
    });

    // Form client-side validation & submit
    const form = document.getElementById('loginForm');
    const emailInput = document.getElementById('loginEmail');
    const emailError = document.getElementById('emailError');
    const passwordError = document.getElementById('passwordError');
    const authAlert = document.getElementById('authAlert');
    const authAlertText = document.getElementById('authAlertText');
    const submitBtn = document.getElementById('loginSubmitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      emailError.classList.remove('visible');
      passwordError.classList.remove('visible');
      authAlert.style.display = 'none';

      let isValid = true;
      const email = emailInput.value.trim();
      const password = pwdInput.value;

      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!email || !emailRegex.test(email)) {
        emailError.classList.add('visible');
        isValid = false;
      }

      if (!password) {
        passwordError.classList.add('visible');
        isValid = false;
      }

      if (!isValid) return;

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Signing in...';

      try {
        const response = await fetch('/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await response.json();

        if (response.ok && data.success) {
          window.location.href = data.redirect || '/app';
        } else {
          authAlertText.textContent = data.message || 'Invalid email or password';
          authAlert.style.display = 'flex';
          submitBtn.disabled = false;
          submitBtn.innerHTML = '<span>Sign In</span> <i class="fa-solid fa-arrow-right"></i>';
        }
      } catch (err) {
        authAlertText.textContent = 'Network or server error. Please try again.';
        authAlert.style.display = 'flex';
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<span>Sign In</span> <i class="fa-solid fa-arrow-right"></i>';
      }
    });
  </script>
</body>
</html>
